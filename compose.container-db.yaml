name: ${COMPOSE_PROJECT_NAME:-wordpress-site}

services:
  db:
    image: ${MARIADB_IMAGE:-mariadb:11.8}
    restart: unless-stopped
    init: true
    environment:
      MARIADB_DATABASE: ${DB_NAME:-wordpress}
      MARIADB_USER: ${DB_USER:-wordpress}
      MARIADB_PASSWORD_FILE: /run/secrets/db_password
      MARIADB_ROOT_PASSWORD_FILE: /run/secrets/db_root_password
      MARIADB_AUTO_UPGRADE: "1"
    secrets:
      - db_password
      - db_root_password
    volumes:
      - db_data:/var/lib/mysql
      - ./mariadb/low-memory.cnf:/etc/mysql/conf.d/zz-low-memory.cnf:ro
    networks:
      - backend
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 40s
      interval: 15s
      timeout: 5s
      retries: 8
    mem_limit: ${DB_MEM_LIMIT:-384m}
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 45s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  wordpress:
    image: ${WORDPRESS_IMAGE:-wordpress:7.0-php8.3-fpm-alpine}
    restart: unless-stopped
    init: true
    depends_on:
      db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${DB_NAME:-wordpress}
      WORDPRESS_DB_USER: ${DB_USER:-wordpress}
      WORDPRESS_DB_PASSWORD_FILE: /run/secrets/db_password
      WORDPRESS_TABLE_PREFIX: ${WP_TABLE_PREFIX:-wp_}
      WORDPRESS_HOME: ${WP_HOME:?Set WP_HOME in the selected environment file}
      WORDPRESS_SITEURL: ${WP_SITEURL:?Set WP_SITEURL in the selected environment file}
      WORDPRESS_CONFIG_EXTRA: |
        $$docker_wp_home = rtrim( getenv_docker( 'WORDPRESS_HOME', '' ), '/' );
        $$docker_wp_siteurl = rtrim( getenv_docker( 'WORDPRESS_SITEURL', $$docker_wp_home ), '/' );
        define( 'WP_HOME', $$docker_wp_home );
        define( 'WP_SITEURL', $$docker_wp_siteurl );
        define( 'WP_ENVIRONMENT_TYPE', 'production' );
        define( 'DISALLOW_FILE_EDIT', true );
        define( 'WP_MEMORY_LIMIT', '128M' );
        define( 'WP_MAX_MEMORY_LIMIT', '192M' );
        define( 'FORCE_SSL_ADMIN', str_starts_with( $$docker_wp_home, 'https://' ) );
    secrets:
      - db_password
    volumes:
      - wordpress_data:/var/www/html
      - ./php/custom.ini:/usr/local/etc/php/conf.d/zz-custom.ini:ro
      - ./php/fpm-pool.conf:/usr/local/etc/php-fpm.d/zz-site.conf:ro
    networks:
      - frontend
      - backend
    expose:
      - "9000"
    healthcheck:
      test:
        - CMD
        - php
        - -r
        - >-
          $$p=trim(file_get_contents('/run/secrets/db_password'));
          $$db=@new mysqli('db', getenv('WORDPRESS_DB_USER'), $$p,
          getenv('WORDPRESS_DB_NAME'), 3306);
          exit($$db->connect_errno ? 1 : 0);
      start_period: 30s
      interval: 15s
      timeout: 5s
      retries: 8
    mem_limit: ${WP_MEM_LIMIT:-512m}
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    image: ${NGINX_IMAGE:-nginx:1.30-alpine}
    restart: unless-stopped
    init: true
    depends_on:
      wordpress:
        condition: service_healthy
    ports:
      - "127.0.0.1:${HTTP_PORT:-8080}:80"
    volumes:
      - wordpress_data:/var/www/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - frontend
    mem_limit: ${NGINX_MEM_LIMIT:-64m}
    pids_limit: 64
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      start_period: 20s
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

secrets:
  db_password:
    file: ./secrets/db_password.txt
  db_root_password:
    file: ./secrets/db_root_password.txt

volumes:
  wordpress_data:
  db_data:

networks:
  frontend:
  backend:
    internal: true
